appId: com.folk.app
productName: folk
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  # Signing identity prefix — electron-builder matches any identity in the
  # imported keychain whose name starts with this string. Forcing
  # "Developer ID Application" prevents accidental fallback to an "Apple
  # Development" cert (which would sign successfully but fail notarization
  # because dev certs aren't trusted by Gatekeeper for distribution).
  identity: Developer ID Application
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Built-in notarization (electron-builder >= 24). Reads credentials from env:
  # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID — provided by CI.
  # Set to false locally to skip the (~10min) notarization round-trip.
  notarize: true
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
publish:
  provider: github
  owner: barockok
  repo: folk
  releaseType: release
