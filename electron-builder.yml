appId: com.folk.app
productName: folk
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  # No `identity` key — electron-builder auto-detects the Developer ID
  # Application identity from CSC_LINK + CSC_KEY_PASSWORD env in CI.
  # For unsigned local dev builds, set CSC_IDENTITY_AUTO_DISCOVERY=false.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Built-in notarization (electron-builder >= 24). Reads credentials from env:
  # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID — provided by CI.
  # Set to false locally to skip the (~10min) notarization round-trip.
  notarize: true
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
publish:
  provider: github
  owner: barockok
  repo: folk
  releaseType: release
