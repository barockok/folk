      <stop offset="0" stop-color="#6a4dff"/>
      <stop offset="1" stop-color="#3a23c4"/>
    </linearGradient>
    <radialGradient id="sheen2" cx="0.3" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropf2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
